[versions]
# Versions mirror the other Kompakt apps of this shop, so this one builds against the same
# Compose/MMD combination that is known to work on the phone.
agp = "8.13.1"
kotlin = "2.2.21"
mmd = "1.0.2"

androidx-activity = "1.12.0"
androidx-core = "1.17.0"
androidx-lifecycle = "2.10.0"
androidx-compose = "1.9.5"
androidx-material3 = "1.4.0"
androidx-exifinterface = "1.4.1"
coroutines = "1.10.2"
tesseract4android = "4.9.0"

junit = "4.13.2"
orgjson = "20240303"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exifinterface" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "androidx-compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-material3" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidx-compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "androidx-compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "androidx-compose" }

mmd = { module = "com.mudita:MMD", version.ref = "mmd" }
tesseract4android = { module = "cz.adaptech.tesseract4android:tesseract4android-openmp", version.ref = "tesseract4android" }

junit = { module = "junit:junit", version.ref = "junit" }
orgjson = { module = "org.json:json", version.ref = "orgjson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
